[package]
name = "secevidence"
version = "0.1.0"
description = "SecEvidence Desktop"
authors = ["SecEvidence"]
edition = "2021"

[lib]
name = "secevidence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lstrip = true
opt-level = "s"
